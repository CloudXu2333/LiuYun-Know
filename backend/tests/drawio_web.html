<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 流程图生成器 - DeepSeek + Draw.io</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 { font-size: 2.5em; margin-bottom: 5px; }
        .header p { font-size: 1.1em; opacity: 0.9; }
        
        .main-content {
            display: grid;
            grid-template-columns: 420px 1fr;
            min-height: 750px;
        }
        
        .sidebar {
            background: #f8f9fa;
            padding: 25px;
            border-right: 2px solid #dee2e6;
            overflow-y: auto;
            max-height: 750px;
        }
        
        .input-section h3 { color: #333; margin-bottom: 12px; font-size: 1.1em; }
        
        .input-section textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 12px;
        }
        
        .input-section textarea:focus { outline: none; border-color: #667eea; }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover { background: #667eea; color: white; }
        
        .examples { margin-top: 15px; }
        .examples h4 { color: #666; font-size: 0.85em; margin-bottom: 8px; }
        
        .example-item {
            padding: 8px 10px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }
        
        .example-item:hover { border-color: #667eea; background: #f0f4ff; }
        
        /* 进度日志区域 */
        .progress-section {
            margin-top: 15px;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .progress-section h4 {
            color: #4fc3f7;
            font-size: 0.9em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .log-item {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8em;
            padding: 4px 0;
            border-bottom: 1px solid #333;
            color: #e0e0e0;
        }
        
        .log-item.step { color: #4fc3f7; font-weight: bold; }
        .log-item.node { color: #81c784; }
        .log-item.edge { color: #ffb74d; }
        .log-item.error { color: #ef5350; }
        .log-item.complete { color: #aed581; font-weight: bold; }
        
        .log-time {
            color: #757575;
            margin-right: 8px;
        }
        
        .viewer-section {
            padding: 20px;
            background: #fafafa;
        }
        
        #drawio-frame {
            width: 100%;
            height: 710px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background: white;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .status {
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 0.9em;
        }
        
        .status.info { background: #e7f3ff; border-left: 3px solid #2196F3; color: #0d47a1; }
        .status.success { background: #e8f5e9; border-left: 3px solid #4caf50; color: #1b5e20; }
        .status.error { background: #ffebee; border-left: 3px solid #f44336; color: #b71c1c; }
        .status.loading { background: #fff3e0; border-left: 3px solid #ff9800; color: #e65100; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 AI 流程图生成器</h1>
            <p>DeepSeek AI + Draw.io - 实时查看生成过程</p>
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="input-section">
                    <h3>📝 描述你的流程</h3>
                    <textarea id="description" placeholder="例如：用户登录流程、电商订单处理..."></textarea>
                </div>
                
                <button class="btn btn-primary" id="generateBtn" onclick="generateDiagramStream()">
                    <span id="btnText">🤖 AI 生成流程图</span>
                </button>
                
                <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清空</button>
                
                <div class="examples">
                    <h4>💡 示例（点击使用）</h4>
                    <div class="example-item" onclick="useExample('用户注册流程')">用户注册流程</div>
                    <div class="example-item" onclick="useExample('电商订单处理流程')">电商订单处理流程</div>
                    <div class="example-item" onclick="useExample('软件开发生命周期')">软件开发生命周期</div>
                    <div class="example-item" onclick="useExample('请假审批流程')">请假审批流程</div>
                </div>
                
                <div id="status" class="status info" style="display: none;"></div>
                
                <!-- 进度日志 -->
                <div class="progress-section" id="progressSection" style="display: none;">
                    <h4>📋 生成日志</h4>
                    <div id="logList"></div>
                </div>
            </div>
            
            <div class="viewer-section">
                <iframe id="drawio-frame" src="https://embed.diagrams.net/?embed=1&ui=atlas&spin=1&proto=json" frameborder="0"></iframe>
            </div>
        </div>
    </div>
    
    <script>
        const drawioFrame = document.getElementById('drawio-frame');
        
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
        }
        
        function addLog(message, type = '') {
            const logList = document.getElementById('logList');
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `log-item ${type}`;
            div.innerHTML = `<span class="log-time">[${time}]</span>${message}`;
            logList.appendChild(div);
            logList.scrollTop = logList.scrollHeight;
        }
        
        function clearLogs() {
            document.getElementById('logList').innerHTML = '';
        }
        
        function loadDiagram(xmlContent) {
            drawioFrame.contentWindow.postMessage(JSON.stringify({
                action: 'load',
                xml: xmlContent,
                autosave: 0
            }), '*');
        }
        
        function clearAll() {
            const emptyXml = `<?xml version="1.0"?><mxfile><diagram><mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel></diagram></mxfile>`;
            loadDiagram(emptyXml);
            clearLogs();
            document.getElementById('progressSection').style.display = 'none';
            showStatus('已清空', 'info');
        }
        
        function useExample(text) {
            document.getElementById('description').value = text;
            showStatus('已填入示例，点击生成', 'info');
        }
        
        async function generateDiagramStream() {
            const description = document.getElementById('description').value.trim();
            if (!description) {
                showStatus('❌ 请输入流程图描述', 'error');
                return;
            }
            
            const generateBtn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            generateBtn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> 生成中...';
            
            // 显示日志区域
            document.getElementById('progressSection').style.display = 'block';
            clearLogs();
            addLog('开始生成流程图...', 'step');
            showStatus('🤖 AI 正在工作...', 'loading');
            
            try {
                const response = await fetch('/api/generate-stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description })
                });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const text = decoder.decode(value);
                    const lines = text.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                handleStreamData(data);
                            } catch (e) {}
                        }
                    }
                }
            } catch (error) {
                addLog(`错误: ${error.message}`, 'error');
                showStatus(`❌ ${error.message}`, 'error');
            } finally {
                generateBtn.disabled = false;
                btnText.textContent = '🤖 AI 生成流程图';
            }
        }
        
        function handleStreamData(data) {
            switch (data.type) {
                case 'step':
                    addLog(`[步骤${data.step}] ${data.title}: ${data.content}`, 'step');
                    showStatus(`${data.title}: ${data.content}`, 'loading');
                    break;
                case 'node':
                    addLog(`  + ${data.info}`, 'node');
                    break;
                case 'edge':
                    addLog(`  → ${data.info}`, 'edge');
                    break;
                case 'error':
                    addLog(`❌ ${data.content}`, 'error');
                    showStatus(`❌ ${data.content}`, 'error');
                    break;
                case 'complete':
                    addLog('✅ 流程图生成完成！', 'complete');
                    showStatus(`✅ 完成！${data.nodes.length} 个节点，${data.edges.length} 条连接`, 'success');
                    loadDiagram(data.xml);
                    break;
            }
        }
        
        window.addEventListener('message', function(evt) {
            if (evt.data && typeof evt.data === 'string') {
                try {
                    const msg = JSON.parse(evt.data);
                    if (msg.event === 'init') {
                        showStatus('✅ Draw.io 已就绪', 'success');
                    }
                } catch (e) {}
            }
        });
        
        document.getElementById('description').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') generateDiagramStream();
        });
        
        window.onload = function() {
            showStatus('⏳ 加载 Draw.io...', 'loading');
        };
    </script>
</body>
</html>
