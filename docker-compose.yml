# ====================================
# 数据卷
# ====================================
volumes:
  redis_data:
    driver: local
  minio_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  backend_data:
    driver: local
  backend_logs:
    driver: local

# ====================================
# 网络
# ====================================
networks:
  liuyun-network:
    driver: bridge
