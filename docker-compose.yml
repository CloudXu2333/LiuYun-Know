version: '3.8'

services:
  # ====================================
  # Redis 服务
  # ====================================
  redis:
    image: redis:7-alpine
    container_name: liuyun-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - liuyun-network

  # ====================================
  # MinIO 对象存储服务
  # ====================================
  minio:
    image: minio/minio:latest
    container_name: liuyun-minio
    restart: unless-stopped
    ports:
      - "9091:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - liuyun-network

  # ====================================
  # Neo4j 图数据库服务（可选）
