  #     - "7474:7474"  # HTTP
  #     - "7687:7687"  # Bolt
  #   environment:
  #     NEO4J_AUTH: neo4j/your_neo4j_password
  #     NEO4J_PLUGINS: '["apoc"]'
  #     NEO4J_dbms_memory_heap_initial__size: 512m
  #     NEO4J_dbms_memory_heap_max__size: 512m
  #   volumes:
  #     - neo4j_data:/data
  #     - neo4j_logs:/logs
  #   healthcheck:
  #     test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "your_neo4j_password", "RETURN 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #   networks:
  #     - liuyun-network
  #
  # 使用说明：
  # 1. 取消注释上述 neo4j 服务配置
  # 2. 修改 your_neo4j_password 为强密码
  # 3. 在 .env 文件中配置：
  #    NEO4J_URI=bolt://localhost:7687
  #    NEO4J_USER=neo4j
  #    NEO4J_PASSWORD=your_neo4j_password
  # 4. 启动服务：docker-compose up -d neo4j
  # 5. 访问 Neo4j 浏览器：http://localhost:7474

  # ====================================
  # 后端 API 服务
  # ====================================
